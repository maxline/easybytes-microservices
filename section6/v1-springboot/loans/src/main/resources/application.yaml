server:
  port: 8090
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import:
      - "application_qa.yaml"
      - "application_prod.yaml"
  profiles:
    active: "prod"
build:
  version: 3.0
loans:
  message: "Welcome to Loans Service API"
  contactDetails:
    name: "Serhii Loans"
    mail: "serhii@example.com"
  onCallSupport:
