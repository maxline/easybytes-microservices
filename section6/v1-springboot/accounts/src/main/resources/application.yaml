server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import:
      - "application_qa.yaml"
      - "application_prod.yaml"
  profiles:
    active: "prod"
build:
  version: 3.0
accounts:
  message: "Welcome to Accounts Service API"
  contactDetails:
    name: "Serhii"
    mail: "serhii@example.com"
  onCallSupport:
    - (555) 555-5555
    - (444) 444-4444